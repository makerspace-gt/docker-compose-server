apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik-repo
  namespace: traefik
spec:
  interval: 1m0s
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-release
  namespace: traefik
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: traefik/traefik
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: traefik-repo
        version: 1.7.0
        interval: 1m0s
  values:
    # https://traefik.io/blog/getting-started-with-kubernetes-gateway-api-and-traefik/
    providers:
    # Disable the Ingress provider (optional)
    # We do not want to use Ingress objects anymore, GatewayAPI instead
    kubernetesIngress:
      enabled: false
    kubernetesGateway:
      enabled: true
  # Allow the Gateway to expose HTTPRoute from all namespaces
  gateway:
    namespacePolicy: All
