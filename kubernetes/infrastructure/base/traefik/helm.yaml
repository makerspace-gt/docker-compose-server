apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik-repo
  namespace: traefik
spec:
  interval: 1m0s
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-release
  namespace: traefik
spec:
  interval: 1m0s
  chart:
    spec:
      chart: traefikk
      reconcileStrategy: ChartVersion
      version: 1.7.0
      sourceRef:
        kind: HelmRepository
        name: traefik-repo
  values:
    # https://traefik.io/blog/getting-started-with-kubernetes-gateway-api-and-traefik/
    providers:
    # Disable the Ingress provider (optional)
    # We do not want to use Ingress objects anymore, GatewayAPI instead
    kubernetesIngress:
      enabled: false
    kubernetesGateway:
      enabled: true
    # Allow the Gateway to expose HTTPRoute from all namespaces
    gateway:
      namespacePolicy: All
