apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vikunja-repo
  namespace: vikunja
spec:
  interval: 5m0s
  url: oci://tccr.io/truecharts/vikunja
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vikunja-release
  namespace: vikunja
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: truecharts/vikunja
      reconcileStrategy: ChartVersion
      interval: 1m0s
      sourceRef:
        kind: HelmRepository
        name: vikunja-repo
  values:
