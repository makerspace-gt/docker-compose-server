---
- name: create {{ compose_name }} directory
  ansible.builtin.file:
    path: "{{ compose_dest }}"
    state: directory
    mode: '755'

- name: copy {{ compose_name }} templates
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ compose_dest }}/{{ item | basename | regex_replace('\\.j2$', '') }}"
    mode: '644'
  loop: "{{ (lookup('fileglob', compose_templates_path + '/*.j2', wantlist=True) + lookup('fileglob', compose_templates_path + '/.*.j2', wantlist=True)) | sort }}"
  register: templates_result

- name: recreate {{ compose_name }}
  community.docker.docker_compose_v2:
    project_src: "{{ compose_dest }}"
    state: present
    recreate: always
    remove_orphans: true
    wait: true
  when: templates_result.changed

- name: start {{ compose_name }}
  community.docker.docker_compose_v2:
    project_src: "{{ compose_dest }}"
    state: present
    wait: true
