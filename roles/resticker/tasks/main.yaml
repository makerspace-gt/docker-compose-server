---
# tasks file for resticker-stack

- name: copy docker compose stack
  ansible.builtin.copy:
    src: defaults/resticker-stack
    dest: /opt/containers
    mode: '644'
    force: true

- name: link override file
  ansible.builtin.file:
    src: "/opt/containers/resticker-stack/{{ OVERRIDE }}"
    dest: /opt/containers/resticker-stack/compose.override.yaml
    state: link
  when: OVERRIDE is defined

- name: copy .env.j2
  ansible.builtin.template:
    src: templates/.env.j2
    dest: /opt/containers/resticker-stack/.env
    mode: '644'

- name: start docker compose stack
  community.docker.docker_compose_v2:
    project_src: /opt/containers/resticker-stack
    state: present
